<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1480" height="920" viewBox="0 0 1480 920">
  <title>库存报警器视觉预览</title>
  <desc>AE2 风格方块三态、物品栏图标和配置界面静态预览。</desc>
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; letter-spacing: 0; }
      .heading { fill: #17272b; font-size: 34px; font-weight: 700; }
      .section { fill: #31474a; font-size: 18px; font-weight: 700; }
      .label { fill: #354b4c; font-size: 16px; }
      .caption { fill: #607375; font-size: 14px; }
      .ui { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 8px; }
      .ui-small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 7px; }
    </style>
    <symbol id="alarm-block" viewBox="0 0 180 180">
      <path d="M90 12 170 51 90 91 10 51Z" fill="#d9e0dc" stroke="#34494d" stroke-width="3" stroke-linejoin="round"/>
      <path d="M10 51 90 91 90 168 10 128Z" fill="#a5b7b3" stroke="#34494d" stroke-width="3" stroke-linejoin="round"/>
      <path d="M90 91 170 51 170 128 90 168Z" fill="#718987" stroke="#34494d" stroke-width="3" stroke-linejoin="round"/>
      <path d="M22 54 90 88 158 54" fill="none" stroke="#eef2ed" stroke-width="4"/>
      <path d="M20 124 88 157M92 157 160 124" fill="none" stroke="#52696a" stroke-width="5"/>
      <path d="M21 71 78 100 78 141 21 112Z" fill="#41575a" stroke="#263a40" stroke-width="3"/>
      <path d="M102 100 159 71 159 112 102 141Z" fill="#30484c" stroke="#263a40" stroke-width="3"/>
      <path d="M27 79 72 102 72 125 27 103Z" fill="#172b32"/>
      <path d="M108 102 153 79 153 103 108 125Z" fill="#172b32"/>
      <path d="M32 87 49 96M32 94 43 100M113 103 146 86M113 110 135 99" fill="none" stroke="#8da8a6" stroke-width="3" stroke-linecap="square"/>
      <path d="M30 108 48 117 48 121 30 112ZM132 112 150 103 150 108 132 117Z" fill="currentColor"/>
      <path d="M53 119 69 127M111 127 127 119" fill="none" stroke="currentColor" stroke-width="3"/>
      <path d="M90 23 135 45 90 67 45 45Z" fill="#708784" stroke="#34494d" stroke-width="3"/>
      <path d="M90 31 119 45 90 59 61 45Z" fill="#263d42"/>
      <path d="M90 36 108 45 90 54 72 45Z" fill="currentColor"/>
      <path d="M34 66 38 68M142 68 146 66M34 120 38 122M142 122 146 120" fill="none" stroke="#dce6de" stroke-width="3"/>
    </symbol>
    <symbol id="slot" viewBox="0 0 16 16">
      <rect x="0" y="0" width="16" height="16" fill="#b9c8c2"/>
      <rect x="1" y="1" width="14" height="14" fill="#edf2ec"/>
    </symbol>
    <pattern id="inventory-slots" x="59" y="196" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#b9c8c2"/>
      <rect x="1" y="1" width="14" height="14" fill="#edf2ec"/>
    </pattern>
  </defs>

  <rect width="1480" height="920" fill="#f5f7f4"/>
  <rect width="1480" height="10" fill="#293b40"/>
  <text class="heading" x="64" y="67">库存报警器</text>
  <text class="caption" x="64" y="96">视觉概念预览 · 方块、物品栏与配置界面</text>
  <path d="M64 117H1416" stroke="#cbd7d1" stroke-width="2"/>

  <text class="section" x="64" y="155">方块 / 三种状态</text>
  <text class="caption" x="64" y="182">四侧对称的深色仪表面板，顶部与侧面同步指示状态。</text>
  <use xlink:href="#alarm-block" x="60" y="214" width="180" height="180" style="color:#53666a"/>
  <use xlink:href="#alarm-block" x="269" y="214" width="180" height="180" style="color:#3cd4b2"/>
  <use xlink:href="#alarm-block" x="478" y="214" width="180" height="180" style="color:#ed5a53"/>
  <text class="label" x="135" y="429" text-anchor="middle">离线</text>
  <text class="label" x="344" y="429" text-anchor="middle">运行中</text>
  <text class="label" x="553" y="429" text-anchor="middle">库存不足</text>
  <path d="M64 460H676" stroke="#cbd7d1" stroke-width="2"/>

  <text class="section" x="64" y="506">物品栏 / 立体缩略图</text>
  <rect x="75" y="532" width="82" height="82" fill="#b8c8c1" stroke="#78918d" stroke-width="2"/>
  <rect x="83" y="540" width="66" height="66" fill="#e7efea"/>
  <use xlink:href="#alarm-block" x="89" y="544" width="54" height="54" style="color:#795458"/>
  <rect x="203" y="551" width="34" height="34" fill="#b8c8c1" stroke="#78918d"/>
  <rect x="207" y="555" width="26" height="26" fill="#e7efea"/>
  <use xlink:href="#alarm-block" x="209" y="558" width="22" height="22" style="color:#795458"/>
  <text class="caption" x="75" y="643">放大观察</text>
  <text class="caption" x="194" y="611">物品栏尺寸</text>

  <text class="section" x="64" y="716">配色</text>
  <rect x="64" y="739" width="76" height="30" fill="#d9e0dc" stroke="#a7b8b2"/>
  <rect x="154" y="739" width="76" height="30" fill="#172b32"/>
  <rect x="244" y="739" width="76" height="30" fill="#3cd4b2"/>
  <rect x="334" y="739" width="76" height="30" fill="#ed5a53"/>
  <text class="caption" x="64" y="792">金属机壳</text>
  <text class="caption" x="154" y="792">显示面板</text>
  <text class="caption" x="244" y="792">正常</text>
  <text class="caption" x="334" y="792">缺货</text>

  <text class="section" x="748" y="155">配置界面 / 单页示例</text>
  <text class="caption" x="748" y="182">每页 8 条，共 64 条；背包置于下方。示例数据用于展示状态。</text>
  <g transform="translate(748 211) scale(1.9)">
    <rect width="280" height="268" fill="#d9e2dc" stroke="#344b4d" stroke-width="2"/>
    <rect x="2" y="2" width="276" height="21" fill="#263a40"/>
    <rect x="2" y="2" width="3" height="21" fill="#3cd4b2"/>
    <text class="ui" x="11" y="16" fill="#f1f5ef" font-weight="700">库存报警器</text>
    <rect x="203" y="6" width="67" height="13" fill="#684445"/>
    <rect x="207" y="10" width="5" height="5" fill="#ed5a53"/>
    <text class="ui-small" x="216" y="15" fill="#fff0ee">2 项不足</text>

    <rect x="6" y="25" width="268" height="12" fill="#b6c8c0"/>
    <text class="ui-small" x="40" y="34" fill="#355050">物品</text>
    <text class="ui-small" x="127" y="34" fill="#355050">当前库存</text>
    <text class="ui-small" x="197" y="34" fill="#355050">报警阈值</text>

    <g transform="translate(6 38)">
      <rect width="268" height="16" fill="#f3dedb"/>
      <rect width="3" height="16" fill="#dc544e"/>
      <use xlink:href="#slot" x="8" y="0" width="16" height="16"/>
      <path d="M14 4h4v4h-4zM11 9h3v3h-3zM18 10h3v3h-3z" fill="#b93837"/>
      <text class="ui" x="34" y="11" fill="#2d4144">红石粉</text>
      <text class="ui" x="122" y="11" fill="#aa3b37">128</text>
      <rect x="187" y="1" width="61" height="14" fill="#fffaf7" stroke="#c7a8a3" stroke-width="0.7"/>
      <text class="ui" x="192" y="11" fill="#304449">1K</text>
      <text class="ui" x="255" y="11" fill="#ad3e3b" font-weight="700">!</text>
    </g>
    <g transform="translate(6 55)">
      <rect width="268" height="16" fill="#edf3ed"/>
      <rect width="3" height="16" fill="#4eb499"/>
      <use xlink:href="#slot" x="8" y="0" width="16" height="16"/>
      <path d="M11 6h10v5l-3 2H9V8Z" fill="#a6b5b3" stroke="#607a7b" stroke-width="0.8"/>
      <text class="ui" x="34" y="11" fill="#2d4144">铁锭</text>
      <text class="ui" x="122" y="11" fill="#2d6260">2.4K</text>
      <rect x="187" y="1" width="61" height="14" fill="#fbfffb" stroke="#a7bdb4" stroke-width="0.7"/>
      <text class="ui" x="192" y="11" fill="#304449">1K</text>
    </g>
    <g transform="translate(6 72)">
      <rect width="268" height="16" fill="#e6eee8"/>
      <rect width="3" height="16" fill="#4eb499"/>
      <use xlink:href="#slot" x="8" y="0" width="16" height="16"/>
      <path d="M13 3h7l2 8-5 3-7-3Z" fill="#faf7eb" stroke="#98aaa7" stroke-width="0.8"/>
      <text class="ui" x="34" y="11" fill="#2d4144">下界石英</text>
      <text class="ui" x="122" y="11" fill="#2d6260">5.1K</text>
      <rect x="187" y="1" width="61" height="14" fill="#fbfffb" stroke="#a7bdb4" stroke-width="0.7"/>
      <text class="ui" x="192" y="11" fill="#304449">3K</text>
    </g>
    <g transform="translate(6 89)">
      <rect width="268" height="16" fill="#f3dedb"/>
      <rect width="3" height="16" fill="#dc544e"/>
      <use xlink:href="#slot" x="8" y="0" width="16" height="16"/>
      <path d="M12 5h7v6h-7zM18 3h4v4h-4z" fill="#e9c84a" stroke="#a4853e" stroke-width="0.7"/>
      <text class="ui" x="34" y="11" fill="#2d4144">萤石粉</text>
      <text class="ui" x="122" y="11" fill="#aa3b37">0</text>
      <rect x="187" y="1" width="61" height="14" fill="#fffaf7" stroke="#c7a8a3" stroke-width="0.7"/>
      <text class="ui" x="192" y="11" fill="#304449">64</text>
      <text class="ui" x="255" y="11" fill="#ad3e3b" font-weight="700">!</text>
    </g>
    <g fill="#e7eee8">
      <rect x="6" y="106" width="268" height="16"/>
      <rect x="6" y="123" width="268" height="16" fill="#edf3ed"/>
      <rect x="6" y="140" width="268" height="16"/>
      <rect x="6" y="157" width="268" height="16" fill="#edf3ed"/>
    </g>
    <g fill="#f4f7f1" stroke="#aabdb4" stroke-width="0.7">
      <rect x="14" y="106" width="16" height="16"/>
      <rect x="14" y="123" width="16" height="16"/>
      <rect x="14" y="140" width="16" height="16"/>
      <rect x="14" y="157" width="16" height="16"/>
      <rect x="193" y="107" width="61" height="14"/>
      <rect x="193" y="124" width="61" height="14"/>
      <rect x="193" y="141" width="61" height="14"/>
      <rect x="193" y="158" width="61" height="14"/>
    </g>
    <path d="M6 175H274" stroke="#9fb3ac" stroke-width="0.7"/>
    <text class="ui-small" x="58" y="188" fill="#3e5555">背包</text>
    <rect x="208" y="178" width="16" height="13" fill="#c0cec7"/>
    <text class="ui" x="213" y="188" fill="#324b4d">‹</text>
    <text class="ui-small" x="229" y="188" fill="#324b4d">1 / 8</text>
    <rect x="254" y="178" width="16" height="13" fill="#c0cec7"/>
    <text class="ui" x="259" y="188" fill="#324b4d">›</text>
    <rect x="59" y="196" width="162" height="54" fill="url(#inventory-slots)"/>
    <rect x="59" y="250" width="162" height="16" fill="url(#inventory-slots)"/>
    <path d="M59 247H221" stroke="#8fa8a0" stroke-width="0.7"/>
  </g>
  <text class="caption" x="748" y="761">离线时“当前库存”显示为 —；阈值仍可查看与编辑。</text>
  <text class="caption" x="748" y="788">背包图标与方块使用同一造型，GUI 保留现有配置与翻页操作。</text>
  <path d="M64 852H1416" stroke="#cbd7d1" stroke-width="2"/>
  <text class="caption" x="64" y="883">概念图用于确定视觉方向。实际游戏渲染、材质像素及不同 GUI 缩放比例将在实施后验证。</text>
</svg>
